services:
  orbit:
    build: .
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET to a random value with at least 32 characters}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PASSWORD_RESET_CODE_TTL_MINUTES: ${PASSWORD_RESET_CODE_TTL_MINUTES:-15}
    volumes:
      - orbit-data:/app/data
    restart: unless-stopped

volumes:
  orbit-data:
